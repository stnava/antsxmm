[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "antsxmm"
dynamic = ["version"]
description = "A streamlined wrapper for ANTsPyMM tailored for antsxbids BIDS output"
readme = "README.md"
# Codebase uses Python 3.10+ syntax (e.g. PEP 604 unions like `str | None`).
requires-python = ">=3.10"
authors = [
    {name = "ANTsX Community"}
]
dependencies = [
    "antspymm>=1.1.0",
    "antspyt1w",
    "pandas>=1.0.0",
    "tqdm",
    "click",
    "antspyx",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock"
]

[project.scripts]
antsxmm = "antsxmm.pipeline:main"

[tool.setuptools.packages.find]
include = ["antsxmm*"]

[tool.setuptools_scm]
write_to = "antsxmm/_version.py"
fallback_version = "0.0.0-dev"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"  # <--- This suppresses +g<commit>

[tool.pytest.ini_options]
testpaths = ["tests"]
